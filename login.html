<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jerry Travel Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Carter+One&family=Gabarito:wght@400..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Paprika&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
   

<body>
    <header>
        <h2 class="logo">jerry travel hub</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="packages.html">Packages</a>
            <a href="places.html">Places</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="booking.html">BOOK NOW</a>

        </nav>
    </header>
    <div class="page-title">
        <h1>Login</h1>
        <p>Log in or create an account to book your trip</p>
    </div>
    <main class="section">
        <div class="login-panel">
            <button id="login-tab" class="login-tab active" type="button">Log in</button>
            <button id="signup-tab" class="login-tab" type="button">Create account</button>

            <!-- LOGIN FORM -->
            <form id="login-form">

                <h2>Login</h2>

                <label for="login-email">Email</label>
                <input id="login-email" type="email" placeholder="Enter your email" required>

                <label for="login-password">Password</label>
                <input id="login-password" type="password" placeholder="Enter your password" required>

                <button class="button login-submit" type="submit">
                    Log in
                </button>

            </form>


            <!-- CREATE ACCOUNT FORM -->
            <form id="signup-form" style="display: none;">

                <h2>Create Account</h2>

                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Enter your name" required>

                <label for="phone">Phone Number</label>
                <input id="phone" type="tel" placeholder="Enter your phone number" maxlength="10" required>

                <label for="signup-email">Email</label>
                <input id="signup-email" type="email" placeholder="Enter your email" required>

                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" placeholder="Enter your password" minlength="6" required>

                <label for="confirm-password">Confirm Password</label>
                <input id="confirm-password" type="password" placeholder="Confirm your password" minlength="6" required>

                <button class="button" type="submit">
                    Create Account
                </button>

            </form>

            <p class="demo-note">Demo login: account details are saved in this browser only.</p>
        </div>
    </main>
    <footer>
        <p>© 2026 jerry travel hub. All Rights Reserved.</p>
    </footer>
<script src="login.js"></script>
</body>

</html>
